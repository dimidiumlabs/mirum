name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: ./Mirumfile
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_KEY_VERSION: ${{ vars.PACKAGE_KEY_VERSION }}
