# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

name: mirum
version: ${VERSION}
license: AGPL-3.0-or-later
maintainer: Nikolay Govorov <me@govorov.online>
description: Mirum web service

arch: ${ARCH}
platform: linux

# Keep package payloads reproducible across retries of the same release.
mtime: 1970-01-01T00:00:00Z

contents:
  - src: ./LICENSE
    dst: /usr/share/doc/mirum/LICENSE
  - src: ./LICENSES/*
    dst: /usr/share/doc/mirum/LICENSES/
  - src: ./README.md
    dst: /usr/share/doc/mirum/README.md

  - src: target/release/mirum
    dst: /usr/local/bin/mirum
    file_info:
      mode: 0755

  - src: deploy/mirum.toml
    dst: /etc/mirum/config.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: mirum

  - src: deploy/mirum.service
    dst: /usr/lib/systemd/system/mirum.service
    packager: deb
    file_info:
      mode: 0644
  - src: deploy/mirum.service
    dst: /usr/lib/systemd/system/mirum.service
    packager: rpm
    file_info:
      mode: 0644
  - src: deploy/mirum.initd
    dst: /etc/init.d/mirum
    packager: apk
    file_info:
      mode: 0755

scripts:
  preinstall: deploy/scripts/preinstall.sh
  postinstall: deploy/scripts/postinstall.sh
  preremove: deploy/scripts/preremove.sh

deb:
  signature:
    method: debsign
    key_id: ${GPG_KEY_ID}
    key_file: ${SIGNING_PRIVATE_KEY}

rpm:
  group: System Environment/Daemons
  signature:
    key_id: ${GPG_KEY_ID}
    key_file: ${SIGNING_PRIVATE_KEY}

apk:
  signature:
    key_file: ${APK_SIGNING_KEY}
    # nFPM appends ".rsa.pub". Keep the generation in the basename so clients
    # can retain historical package keys during signing-key rotation.
    key_name: packages.${PACKAGE_KEY_VERSION}
